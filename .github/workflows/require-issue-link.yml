name: Require linked issue

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  issue-link:
    name: issue-link
    runs-on: ubuntu-latest
    # Renovate/dependabot PRs reference no issue by design.
    if: github.actor != 'dependabot[bot]'
    steps:
      - name: Check that the PR body references a real issue
        uses: actions/github-script@v7
        with:
          script: |
            const body = (context.payload.pull_request.body || '');
            const refs = [...new Set(
              [...body.matchAll(/#(\d+)/g)].map(m => Number(m[1]))
            )];
            for (const n of refs) {
              try {
                const { data } = await github.rest.issues.get({
                  ...context.repo,
                  issue_number: n,
                });
                if (!data.pull_request) {
                  core.info(`Linked issue #${n} exists.`);
                  return;
                }
              } catch (e) {
                core.info(`#${n} is not an issue: ${e.status}.`);
              }
            }
            core.setFailed(
              'No linked issue found. Add "Closes #<issue>" to the PR body (create the issue first if needed).'
            );
