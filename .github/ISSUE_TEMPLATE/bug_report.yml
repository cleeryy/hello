name: Bug report
description: Something isn't working as documented
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: Tag or commit (e.g. v1.1.0). Check `/health` or the release page.
      placeholder: v1.1.0
    validations:
      required: true
  - type: dropdown
    id: deploy
    attributes:
      label: How do you run hello?
      options: [go run, docker compose, docker run, other]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, what you got (logs, status codes).
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: Commands or dashboard steps to trigger it.
    validations:
      required: false
