openapi: 3.1.0
info:
  title: hello
  version: 1.0.0
  description: Wake-on-LAN registry with live presence. Send magic packets, track
    devices, and subscribe to status changes over WebSocket.
  license:
    name: MIT
servers:
  - url: http://localhost:8080
    description: Local development
security:
  - bearerAuth: []
tags:
  - name: System
    description: Health and machine-readable documentation
  - name: Wake
    description: Send magic packets
  - name: Devices
    description: Device registry (full replacement on PUT, see operation notes)
paths:
  /:
    get:
      tags: [System]
      summary: Welcome
      operationId: welcome
      security: []
      responses:
        '200':
          description: Service banner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Welcome'
  /health:
    get:
      tags: [System]
      summary: Health check
      operationId: health
      security: []
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /openapi.yaml:
    get:
      tags: [System]
      summary: This OpenAPI document
      operationId: openapi
      security: []
      responses:
        '200':
          description: OpenAPI 3.1 YAML
          content:
            application/yaml:
              schema:
                type: string
  /docs:
    get:
      tags: [System]
      summary: Swagger UI
      operationId: docs
      security: []
      responses:
        '200':
          description: Interactive documentation page
          content:
            text/html:
              schema:
                type: string
  /ws:
    get:
      tags: [System]
      summary: Live status stream
      description: >-
        WebSocket upgrade. The server pushes a StatusChange message every time
        the background monitor observes a reachability change. Clients should
        answer ping frames with pong; idle connections are closed after 60s
        without pong.
      operationId: liveStatus
      responses:
        '101':
          description: Switching protocols, status stream starts
        '426':
          description: Upgrade required, use a WebSocket client
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /wake:
    post:
      tags: [Wake]
      summary: Wake the default device
      description: Canonical endpoint. Sends a magic packet to DEFAULT_MAC.
      operationId: wakeDefault
      responses:
        '200':
          description: Magic packet sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WakeResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [Wake]
      summary: Wake the default device (legacy)
      deprecated: true
      description: Kept for backward compatibility. Prefer POST /wake because GET
        must not trigger side effects.
      operationId: wakeDefaultLegacy
      responses:
        '200':
          description: Magic packet sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WakeResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /wake/{macAddress}:
    parameters:
      - $ref: '#/components/parameters/MacAddress'
    post:
      tags: [Wake]
      summary: Wake a device by MAC
      description: Canonical endpoint. Prefer over GET for the same reason as
        POST /wake.
      operationId: wakeMAC
      responses:
        '200':
          description: Magic packet sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WakeResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [Wake]
      summary: Wake a device by MAC (legacy)
      deprecated: true
      description: Kept for backward compatibility. Prefer POST.
      operationId: wakeMACLegacy
      responses:
        '200':
          description: Magic packet sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WakeResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
  /devices:
    get:
      tags: [Devices]
      summary: List devices
      description: Unpaginated. The registry is local and small by design.
      operationId: listDevices
      responses:
        '200':
          description: Current registry snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceList'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Devices]
      summary: Register a device
      operationId: createDevice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceInput'
            examples:
              withPing:
                summary: Monitored host
                value:
                  id: pc-salon
                  name: PC Salon
                  mac: 00:11:22:33:44:55
                  ip: 192.168.1.50
                  ping_enabled: true
      responses:
        '201':
          description: Device registered, echo of the stored representation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /devices/{id}:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    get:
      tags: [Devices]
      summary: Get a device
      operationId: getDevice
      responses:
        '200':
          description: Stored representation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Devices]
      summary: Replace a device
      description: Full replacement. The path id wins over any id in the body.
        Omitted fields reset to defaults (status defaults to unknown).
      operationId: updateDevice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceInput'
      responses:
        '200':
          description: Stored representation after replacement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      tags: [Devices]
      summary: Delete a device
      operationId: deleteDevice
      responses:
        '204':
          description: Deleted, empty body
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /devices/{id}/wake:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    post:
      tags: [Devices]
      summary: Wake a registered device
      description: Looks the device up by id, then sends a magic packet to its MAC.
      operationId: wakeDevice
      responses:
        '200':
          description: Magic packet sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WakeResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /history:
    get:
      tags: [Devices]
      summary: List recorded wakes
      description: Newest first. Filter by registry id, cap the page with limit.
      operationId: listHistory
      parameters:
        - name: device_id
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 50
      responses:
        '200':
          description: Wake log snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WakeHistory'
        '400':
          description: Bad limit, RFC 9457 body
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /schedules:
    get:
      tags: [Schedules]
      summary: List wake schedules
      operationId: listSchedules
      responses:
        '200':
          description: Every schedule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleList'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Schedules]
      summary: Create a wake schedule
      description: >-
        Standard 5-field cron (minute hour day month weekday, e.g. "0 7 * * 1-5")
        or a descriptor like @daily. The device must exist. Creation always
        enables the schedule; pause it later with PUT setting enabled false.
      operationId: createSchedule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleInput'
      responses:
        '201':
          description: Schedule created and running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schedule'
        '400':
          description: Bad JSON, RFC 9457 body
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          description: Unknown device or bad cron, RFC 9457 body
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /schedules/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    put:
      tags: [Schedules]
      summary: Replace a schedule
      description: Full replacement under the path id. Set enabled false to pause.
      operationId: updateSchedule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleInput'
      responses:
        '200':
          description: Schedule replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schedule'
        '400':
          description: Bad JSON, RFC 9457 body
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Unknown device or bad cron, RFC 9457 body
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    delete:
      tags: [Schedules]
      summary: Delete a schedule
      operationId: deleteSchedule
      responses:
        '204':
          description: Deleted, empty body
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /discover:
    post:
      tags: [Discovery]
      summary: Scan the LAN for boxes
      description: >-
        TCP-probes the local /24 then maps live IPs to MACs via the OS ARP
        table. One scan at a time with a 30s cooldown; concurrent or early
        rescans get 429 with a Retry-After hint. No root required.
      operationId: scanNetwork
      responses:
        '200':
          description: Discovered candidates, known flags the registry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoverResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          description: Scan busy or cooling down, RFC 9457 body
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /discover/adopt:
    post:
      tags: [Discovery]
      summary: Import candidates as devices
      description: >-
        All-or-nothing: one duplicate MAC 409s the whole batch, so a retry
        never creates half a fleet. Names default to the hostname, else
        host-<ip>.
      operationId: adoptHosts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdoptInput'
      responses:
        '201':
          description: Devices created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceList'
        '400':
          description: Bad JSON, RFC 9457 body
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          description: Bad MAC or IP, RFC 9457 body
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
components:
  parameters:
    MacAddress:
      name: macAddress
      in: path
      required: true
      description: Colon- or hyphen-separated MAC-48
      schema:
        type: string
        pattern: '^([0-9A-Fa-f]{2}[:-]){5}([0-9A-Fa-f]{2})$'
        example: AA:BB:CC:DD:EE:FF
    DeviceId:
      name: id
      in: path
      required: true
      description: Registry identifier, trimmed on write
      schema:
        type: string
        minLength: 1
        example: pc-salon
  schemas:
    Device:
      type: object
      required: [id, name, mac, status, ping_enabled, last_seen]
      properties:
        id:
          type: string
          example: pc-salon
        name:
          type: string
          example: PC Salon
        mac:
          type: string
          pattern: '^([0-9A-Fa-f]{2}[:-]){5}([0-9A-Fa-f]{2})$'
          example: 00:11:22:33:44:55
        status:
          $ref: '#/components/schemas/DeviceStatus'
        ip:
          type: string
          format: ipv4
          example: 192.168.1.50
        ping_enabled:
          type: boolean
          description: Whether the background monitor pings this device
        last_seen:
          type: integer
          format: int64
          description: Unix timestamp of the last up observation, 0 if never
      additionalProperties: false
    DeviceInput:
      type: object
      required: [id, name, mac]
      description: Same shape as Device. status defaults to unknown when absent
        or empty; PUT ignores body id in favor of the path id.
      properties:
        id:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        mac:
          type: string
          pattern: '^([0-9A-Fa-f]{2}[:-]){5}([0-9A-Fa-f]{2})$'
        status:
          $ref: '#/components/schemas/DeviceStatus'
        ip:
          type: string
          format: ipv4
        ping_enabled:
          type: boolean
        last_seen:
          type: integer
          format: int64
      additionalProperties: false
    DeviceStatus:
      type: string
      enum: [up, down, unknown]
    DeviceList:
      type: object
      required: [devices]
      properties:
        devices:
          type: array
          items:
            $ref: '#/components/schemas/Device'
      additionalProperties: false
    WakeEvent:
      type: object
      description: One sent magic packet, success or failure, newest first
      required: [id, device_id, mac, at, trigger, success]
      properties:
        id:
          type: string
          example: h-1758210000000000000-1
        device_id:
          type: string
          description: Registry id, or the MAC itself for unregistered targets
          example: pc-salon
        mac:
          type: string
          pattern: '^([0-9A-Fa-f]{2}[:-]){5}([0-9A-Fa-f]{2})$'
          example: 00:11:22:33:44:55
        at:
          type: integer
          format: int64
          description: Unix seconds when the packet was sent
        trigger:
          type: string
          enum: [manual, schedule]
        success:
          type: boolean
        error:
          type: string
      additionalProperties: false
    WakeHistory:
      type: object
      required: [history]
      properties:
        history:
          type: array
          items:
            $ref: '#/components/schemas/WakeEvent'
      additionalProperties: false
    Schedule:
      type: object
      description: One cron wake for a registered device
      required: [id, device_id, cron, enabled]
      properties:
        id:
          type: string
          example: morning
        device_id:
          type: string
          example: pc-salon
        cron:
          type: string
          description: Standard 5-field cron or descriptor (@daily, @every 1h)
          example: 0 7 * * 1-5
        enabled:
          type: boolean
      additionalProperties: false
    ScheduleInput:
      type: object
      description: Same shape as Schedule. POST ignores enabled and activates.
      required: [id, device_id, cron]
      properties:
        id:
          type: string
          minLength: 1
        device_id:
          type: string
          minLength: 1
        cron:
          type: string
          minLength: 1
        enabled:
          type: boolean
      additionalProperties: false
    ScheduleList:
      type: object
      required: [schedules]
      properties:
        schedules:
          type: array
          items:
            $ref: '#/components/schemas/Schedule'
      additionalProperties: false
    Host:
      type: object
      description: One discovered box. Empty mac means probed but untraceable, not adoptable yet.
      required: [ip, mac, known]
      properties:
        ip:
          type: string
          format: ipv4
          example: 192.168.1.10
        mac:
          type: string
          pattern: '^([0-9A-Fa-f]{2}[:-]){5}([0-9A-Fa-f]{2})$'
          example: 11:22:33:44:55:66
        hostname:
          type: string
          example: nas.local
        known:
          type: boolean
          description: True when the MAC already lives in the registry
      additionalProperties: false
    DiscoverResult:
      type: object
      required: [hosts]
      properties:
        hosts:
          type: array
          items:
            $ref: '#/components/schemas/Host'
      additionalProperties: false
    AdoptInput:
      type: object
      required: [hosts]
      properties:
        hosts:
          type: array
          minItems: 1
          items:
            type: object
            required: [mac]
            properties:
              mac:
                type: string
                pattern: '^([0-9A-Fa-f]{2}[:-]){5}([0-9A-Fa-f]{2})$'
              ip:
                type: string
                format: ipv4
              name:
                type: string
                minLength: 1
              hostname:
                type: string
            additionalProperties: false
      additionalProperties: false
    Welcome:
      type: object
      required: [message, defaultMac]
      properties:
        message:
          type: string
          example: welcome to the hello api!
        defaultMac:
          type: string
          example: 00:11:22:33:44:55
      additionalProperties: false
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
      additionalProperties: false
    WakeResult:
      type: object
      required: [message]
      properties:
        message:
          type: string
          example: magic packet sent to AA:BB:CC:DD:EE:FF !
      additionalProperties: false
    StatusChange:
      type: object
      description: WebSocket push payload on every observed reachability change
      required: [type, device]
      properties:
        type:
          type: string
          enum: [status]
        device:
          $ref: '#/components/schemas/Device'
      additionalProperties: false
    Problem:
      type: object
      description: RFC 9457 problem details. All errors share this envelope.
      required: [type, title, status, detail]
      properties:
        type:
          type: string
          format: uri
          example: about:blank
        title:
          type: string
          example: not found
        status:
          type: integer
          example: 404
        detail:
          type: string
          example: 'storage: device not found'
      additionalProperties: false
    ValidationProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [errors]
          properties:
            errors:
              type: object
              description: Field to failing-rule map for 422 bodies
              additionalProperties:
                type: string
              example: { "MAC": "mac" }
          additionalProperties: false
  responses:
    NotFound:
      description: Unknown id, RFC 9457 body
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Duplicate id, RFC 9457 body
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableEntity:
      description: Semantic validation failure, RFC 9457 body
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblem'
    InternalError:
      description: Server failure, generic detail, RFC 9457 body
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing or invalid bearer token, RFC 9457 body
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: API token from API_TOKEN. Browsers calling /ws use ?token= instead.
